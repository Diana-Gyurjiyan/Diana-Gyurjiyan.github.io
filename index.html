<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diana Gyurjiyan</title>
    <style>
        :root {
            --text: #1f2937;
            --bg: #f9fafb;
            --card-bg: #ffffff;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 480px;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            text-align: center;
            margin: 1rem;
        }

        h1 {
            margin-top: 0;
            font-size: 1.75rem;
            color: #111827;
        }

        p {
            color: #6b7280;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Diana Gyurjiyan</h1>
        <p>Page under construction.</p>
    </div>

</body>
</html>
